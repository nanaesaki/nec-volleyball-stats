name: Ingest SV.LEAGUE Match Data

on:
  workflow_dispatch:
    inputs:
      form_b_url:
        description: "帳票BのPDF URL（任意）"
        required: false
        default: ""
      form_a_url:
        description: "帳票AのPDF URL（任意）"
        required: false
        default: ""
      live_score_url:
        description: "Live Score URL（任意）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run ingestion script
        env:
          FORM_B_URL: ${{ inputs.form_b_url }}
          FORM_A_URL: ${{ inputs.form_a_url }}
          LIVE_SCORE_URL: ${{ inputs.live_score_url }}
        run: |
          python backend/ingest_cli.py

      - name: Commit and push updated matches.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/matches.json
          if git diff --staged --quiet; then
            echo "No changes to matches.json"
          else
            git commit -m "chore: update match analytics data"
            git push
          fi
